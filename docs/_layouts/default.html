<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101713">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body class="{% if page.layout == 'guide' %}guide-page{% endif %}">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">Vibival</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/README.html' | relative_url }}">Guide</a>
        <a href="{{ '/client/' | relative_url }}">Play in browser</a>
        <a href="https://github.com/0n4t3/vibival-game/releases">Downloads</a>
      </nav>
    </header>
    {{ content }}
    <footer class="site-footer">
      <span>Vibival</span>
      <span>Open source under the MIT License</span>
    </footer>
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </body>
</html>
