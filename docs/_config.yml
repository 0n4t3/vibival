title: Vibival
email: ''
description: A slow, grounded survival game in a Carboniferous coal swamp.
# Served from the custom domain in CNAME, so there is no project subpath.
url: 'https://vibival.dns7.top'
baseurl: ''
markdown: kramdown
plugins: []
# The site source is docs/, so paths here are relative to docs/.
exclude:
  - client/README.md
  - game-doc.md
  - game-doc-late-game.md
sass:
  style: compressed

# Keep the original guide files, while applying the site’s documentation layout.
defaults:
  - scope:
      path: ''
      type: pages
    values:
      layout: guide
